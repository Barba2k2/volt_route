name: volt_route
description: "EV trip planner with charging stops and SoC estimation"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.2
  equatable: ^2.0.7
  
  # Navigation
  go_router: ^15.1.2
  
  # HTTP & Network
  dio: ^5.8.0+1
  
  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.1.1
  
  # Local Storage
  isar: ^3.0.5
  isar_flutter_libs: ^3.0.5
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4
  
  # Google Services
  google_maps_flutter: ^2.9.0
  google_places_flutter: ^2.0.9
  
  # Utilities
  intl: ^0.20.2
  collection: ^1.18.0
  logger: ^2.6.1
  gap: ^3.0.1
  shimmer: ^3.0.0
  
  # UI
  cupertino_icons: ^1.0.8
  
  # Error Handling & Validation
  result_dart: ^2.1.1
  lucid_validation: ^1.3.1
  
  # Monitoring (optional)
  sentry_flutter: ^8.4.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Analysis
  flutter_lints: ^4.0.0
  
  # Code Generation
  build_runner: ^2.4.13
  injectable_generator: ^2.1.6
  isar_generator: ^3.0.5
  
  # Testing
  # bloc_test: ^9.0.0
  # mocktail: ^0.2.0
  fake_async: ^1.3.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

